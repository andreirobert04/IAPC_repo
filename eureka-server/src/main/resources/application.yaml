server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # The registry itself does not register with or fetch from another registry
    register-with-eureka: false
    fetch-registry: false
  server:
    # Faster removal of stopped services during local development
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
