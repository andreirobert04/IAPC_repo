# Story 3 - pre-retrieval pipeline.
server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: retrieval-pre
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.genai.first.retrievalpre: info
