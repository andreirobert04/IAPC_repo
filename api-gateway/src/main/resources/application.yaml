# Only public entry point. Routes are built from Eureka:
#   /ingest-static/**  -> ingest-static
#   /ingest-dynamic/** -> ingest-dynamic
#   /retrieval-pre/**  -> retrieval-pre
#   /retrieval-post/** -> retrieval-post
# (the service-name prefix is stripped before forwarding).
# Note: on Spring Cloud 2025.0+ the prefix becomes spring.cloud.gateway.server.webflux.*
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
