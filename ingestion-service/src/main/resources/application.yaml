server:
  port: 8083

spring:
  application:
    name: ingestion-service
  threads:
    virtual:
      enabled: true
  ai:
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        use-tls: false
        collection-name: rag_documents
        initialize-schema: true

    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text:latest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  rag:
    force-rebuild: true
    chunk:
      size: 100
      min-chunk-size: 200
      min-chunk-to-embed: 50
      max-num-chunks: 8192
      keep-separator: true
    pdf:
      mode: page #paragraph
      path: classpath:rag/qa-over-internal-docs/*.pdf #file:/Users/Shared/rag-files/qa-over-internal-docs/*.pdf
      pages-per-document: 1
      left-alignment: true
      number-of-top-text-lines-to-delete: 0
      number-of-bottom-text-lines-to-delete: 0

logging:
  level:
    root: info
    com.genai.first.ingestion: info
    org.springframework.ai: info
