# Story 2 - dynamic ingestion (skeleton).
server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ingest-dynamic
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.genai.first.ingestdynamic: info
